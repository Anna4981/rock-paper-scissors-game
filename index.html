<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">Pick your move and beat the computer!</p>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score-box">
        <span class="label">You</span>
        <span id="player-score" class="value">0</span>
      </div>
      <div class="score-box">
        <span class="label">Draws</span>
        <span id="draw-score" class="value">0</span>
      </div>
      <div class="score-box">
        <span class="label">Computer</span>
        <span id="computer-score" class="value">0</span>
      </div>
    </section>

    <section class="choices" aria-label="Choose your move">
      <button class="choice-btn" data-choice="rock">
        <span class="emoji" aria-hidden="true">✊</span>
        <span>Rock</span>
      </button>
      <button class="choice-btn" data-choice="paper">
        <span class="emoji" aria-hidden="true">✋</span>
        <span>Paper</span>
      </button>
      <button class="choice-btn" data-choice="scissors">
        <span class="emoji" aria-hidden="true">✌️</span>
        <span>Scissors</span>
      </button>
    </section>

    <section class="result" aria-live="polite">
      <div class="picks">
        <p>You chose: <strong id="player-pick">-</strong></p>
        <p>Computer chose: <strong id="computer-pick">-</strong></p>
      </div>
      <p id="message" class="message">Make your move!</p>
    </section>

    <button id="reset-btn" class="reset-btn">Reset Score</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
